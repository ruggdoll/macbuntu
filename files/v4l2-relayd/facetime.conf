# Webcam FaceTime HD (via la puce T1) : elle ne sort que du H.264.
# v4l2-relayd la decode vers une camera virtuelle en YUY2, et n'allume la vraie
# camera que lorsqu'une application ouvre la camera virtuelle.
VIDEOSRC="v4l2src device=/dev/v4l/by-id/usb-Apple_Inc._iBridge-video-index0 ! video/x-h264,width=1280,height=720,framerate=30/1 ! h264parse ! avdec_h264 ! videoconvert"
FORMAT=YUY2
WIDTH=1280
HEIGHT=720
FRAMERATE=30/1
CARD_LABEL="FaceTime HD"
