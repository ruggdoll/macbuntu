# La webcam de la T1 ne sort que du H.264, que les applis ne savent pas lire.
# On la masque : les applis utilisent la camera virtuelle "FaceTime HD" (v4l2-relayd).
monitor.v4l2.rules = [
  {
    matches = [ { device.name = "~v4l2_device.pci-0000_00_14.0-usb-0_3_2.0*" } ]
    actions = { update-props = { device.disabled = true } }
  }
]
