# Son MacBook Pro (Cirrus CS8409 + amplis MAX98706) : module audio du noyau avec les correctifs davidjo (89b22ff)
PACKAGE_NAME="snd-hda-macbookpro"
PACKAGE_VERSION="89b22ff"
PRE_BUILD="prebuild.sh $kernelver"
MAKE[0]="make KERNELRELEASE=$kernelver"
CLEAN="rm -rf build"
BUILT_MODULE_NAME[0]="snd-hda-codec-cs8409"
BUILT_MODULE_LOCATION[0]="build/hda/codecs/cirrus"
DEST_MODULE_LOCATION[0]="/updates/dkms"
AUTOINSTALL="yes"
